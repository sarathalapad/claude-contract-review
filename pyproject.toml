[project]
name = "claude-contract-review"
version = "0.1.0"
description = "Playbook-driven procurement contract review on the Claude API, with grounded findings and audited human sign-off."
authors = [{ name = "Sarathkumar K" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
